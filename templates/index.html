<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Measurement Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ededed; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ffffff; margin-bottom: 2rem; font-weight: 500; letter-spacing: -0.5px; font-size: 2.5rem; }
        .dashboard { display: flex; gap: 1.5rem; width: 100%; max-width: 1400px; flex-wrap: wrap; }
        .video-container { flex: 2; min-width: 600px; background: #0a0a0a; padding: 1rem; border-radius: 16px; border: 1px solid #222; }
        .video-container img { width: 100%; border-radius: 12px; }
        .stats-container { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: #0a0a0a; padding: 1.5rem; border-radius: 16px; border: 1px solid #222; }
        .card h2 { margin-top: 0; font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
        .stat-value { font-size: 3rem; font-weight: 600; color: #fff; letter-spacing: -1px; margin-top: 0.5rem; }
        .pass-text { color: #2ecc71; font-weight: 600; }
        .fail-text { color: #e74c3c; font-weight: 600; }
        
        .save-btn { background: #ffffff; color: #000000; border: 1px solid #fff; padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .save-btn:hover { background: #000; color: #fff; border: 1px solid #fff; }
        .save-btn:active { transform: scale(0.98); }
        
        table { width: 100%; text-align: left; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { padding: 0.8rem 0; border-bottom: 1px solid #222; font-size: 0.95rem; }
        th { color: #888; font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;}
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
    <h1>Vision Measurement System</h1>
    <div class="dashboard">
        <div class="video-container">
            <img src="/video_feed" alt="Live Video Feed">
        </div>
        <div class="stats-container">
            <div class="card">
                <h2>Total Parts Detected</h2>
                <div class="stat-value" id="part-count">0</div>
            </div>
            
            <button class="save-btn" onclick="saveData()">Save to CSV Spreadsheet 📥</button>
            
            <div class="card">
                <h2>Live Data Stream</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Part</th>
                            <th>Length</th>
                            <th>Width</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="parts-table">
                        <!-- Populated by JS -->
                        <tr><td colspan="4" style="text-align:center; color:#64748b;">Waiting for parts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                
                document.getElementById('part-count').innerText = data.length;
                
                const tableBody = document.getElementById('parts-table');
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">No parts found in view.</td></tr>';
                    return;
                }

                data.forEach(part => {
                    const statusClass = part.passed ? 'pass-text' : 'fail-text';
                    const statusText = part.passed ? 'PASS' : 'FAIL';
                    
                    const row = `<tr>
                        <td>#${part.contour_idx}</td>
                        <td>${part.length_mm.toFixed(1)} mm</td>
                        <td>${part.width_mm.toFixed(1)} mm</td>
                        <td class="${statusClass}"><strong>${statusText}</strong></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (e) {
                console.error("Error fetching stats:", e);
            }
        }

        async function saveData() {
            try {
                const res = await fetch('/api/save', { method: 'POST' });
                const result = await res.json();
                
                // Show a nice little animation on the button instead of annoying alert
                const btn = document.querySelector('.save-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Saved Successfully! ✓';
                btn.style.background = '#2ecc71';
                btn.style.color = '#fff';
                btn.style.borderColor = '#2ecc71';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2000);
                
            } catch (e) {
                alert("Failed to save.");
            }
        }

        // Poll for updates every 250ms for a snappy UI
        setInterval(updateStats, 250);
    </script>
</body>
</html>
